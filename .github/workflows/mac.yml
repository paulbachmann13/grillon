name: Application Mac

# Construit Grillon.dmg (Mac Intel et Apple Silicon). À lancer à la main (Actions → Application Mac)
# ou en poussant une étiquette « v1.2.0 » : le .dmg est alors publié dans les Releases GitHub.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Construire le .dmg universel
        run: npm run build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: Grillon-mac
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Publier dans les Releases (étiquette v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg --title "Grillon ${{ github.ref_name }}" --notes "Application Mac (Intel et Apple Silicon). Non signée : au premier lancement, Réglages Système → Confidentialité et sécurité → « Ouvrir quand même »."
