[package]
name = "grillon"
version = "1.14.0"
description = "Grillon — tableur local et gratuit"
license = "Apache-2.0"
edition = "2021"

[lib]
name = "grillon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
lto = true
opt-level = "s"
strip = true
